# Install at /etc/nginx/snippets/pwastore-security-headers.conf.
# HTTPS frontend only. Repeat this include in every location with add_header.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Other CSP directives are in index.html; frame-ancestors requires an HTTP header.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
