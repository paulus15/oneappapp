# Include ONLY inside the existing HTTPS server for pwastore.online.
# Keep its TLS certificate and listen directives. Do not apply to the API server.
root /var/www/apps/pwastore/app;
index index.html;

location ~ /\. {
    deny all;
}

location = /index.html {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location ~ ^/(sw\.js|manifest\.json|release\.json|workbox-[a-zA-Z0-9_-]+\.js)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# Only fingerprinted build assets receive immutable caching.
location ~ "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2?|png|jpe?g|svg|webp|avif)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /assets/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ~* \.(js|css|json|webmanifest|png|ico|svg|jpe?g|webp|avif|woff2?)$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-store" always;
    try_files $uri $uri/ /index.html;
}
