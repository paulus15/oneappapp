# Include ONLY inside the existing HTTPS server for pwastore.online.
# Keep its TLS certificate and listen directives. Do not apply to the API server.
root /var/www/apps/pwastore/app;
index index.html;
include /etc/nginx/snippets/pwastore-security-headers.conf;

# Standard files (Android asset links, ACME challenges) live under /.well-known/.
location ^~ /.well-known/ {
    try_files $uri =404;
}

location ~ /\. {
    deny all;
}

# Crawlers must receive real text/XML files, never the SPA fallback.
location = /robots.txt {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    default_type text/plain;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
location = /sitemap.xml {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    default_type application/xml;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /spa.html {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location = /index.html {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}

location ~ ^/(sw\.js|manifest\.json|release\.json|workbox-[a-zA-Z0-9_-]+\.js)$ {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri =404;
}

# Only fingerprinted build assets receive immutable caching.
location ~ "^/assets/.+-[a-zA-Z0-9_-]{8,}\.(js|css|woff2?|png|jpe?g|svg|webp|avif)$" {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

location /assets/ {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location ~* \.(js|css|json|webmanifest|png|ico|svg|jpe?g|webp|avif|woff2?)$ {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Private screens remain crawlable so Google can read noindex.
location ~ ^/(?:admin|developer|account|notifications|login|register|verify-email|forgot-password)(?:/|$) {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html /spa.html;
}

# Public router paths not materialized at build time still need their neutral SPA shell.
location ~ ^/(?:applications|rankings|recommended|trending|popular|developers|categories|contact|about|help|terms|privacy|publishing-rules)/?$|^/(?:apps|publishers)/[0-9]+/?$|^/(?:categories|collections)/[a-zA-Z0-9_-]+/?$ {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri $uri.html /spa.html;
}

location / {
    include /etc/nginx/snippets/pwastore-security-headers.conf;
    add_header Cache-Control "no-store" always;
    # Unknown routes keep a real HTTP 404 while displaying the app’s error screen.
    error_page 404 /spa.html;
    try_files $uri $uri.html $uri/ =404;
}
