<!doctype html>
<html lang="fr">
  <head>
    <title>PWAStore — Découvrez les applications web progressives (PWA)</title>

    <meta charset="utf-8" />
    <meta name="theme-color" content="#075BFF" />
    <meta name="application-name" content="PWAStore" />
    <% if (ctx.mode.pwa) { %>
    <link rel="manifest" href="/manifest.json" />
    <% } %>
    <meta name="apple-mobile-web-app-title" content="PWAStore" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PWAStore" />
    <meta property="og:title" content="PWAStore" />
    <meta
      property="og:description"
      content="Découvrez PWAStore, le catalogue d’applications web progressives pour mobile et ordinateur."
    />
    <!-- Absolute URL: link previews (LinkedIn, WhatsApp, Facebook) ignore relative paths. -->
    <meta
      property="og:image"
      content="https://pwastore.online/brand/pwastore-social.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="PWAStore" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://pwastore.online/brand/pwastore-social.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-icon-180x180.png"
    />
    <meta
      name="description"
      content="Découvrez PWAStore, le catalogue d’applications web progressives pour mobile et ordinateur."
    />
    <% for (const token of originTrialTokens) { %>
    <meta http-equiv="origin-trial" content="<%= token %>" />
    <% } %> <% if (googleSiteVerification) { %>
    <meta
      name="google-site-verification"
      content="<%= googleSiteVerification %>"
    />
    <% } %>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: <%= apiOrigin %>; font-src 'self'; connect-src 'self' <%= apiOrigin %><% if (ctx.dev) { %> ws://localhost:*<% } %>; worker-src 'self'; manifest-src 'self' https:; frame-src blob:; media-src blob:; object-src 'none'; base-uri 'self'; form-action 'self';"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="/icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="/favicon.ico" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
