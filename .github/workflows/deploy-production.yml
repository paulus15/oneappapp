name: Deploy frontend production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwastore-frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src-pwa/package-lock.json
      # Lock files are generated with the .nvmrc Node/npm: regenerate them with that
      # version (npm install --package-lock-only) when npm ci reports a mismatch.
      - run: npm ci
      - run: npm ci --prefix src-pwa
      # A known vulnerable runtime dependency stops the release before it is built.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:check
      - run: npm run test:unit
      # npm run build:pwa executes quasar build -m pwa and produces dist/pwa/.
      - name: Compile the production PWA into dist/pwa
        run: npm run build:pwa
        env:
          PWA_REQUIRE_API_URL: '1'
          VITE_API_URL: https://api.pwastore.online/api
          PWA_GOOGLE_SITE_VERIFICATION: ${{ vars.PWA_GOOGLE_SITE_VERIFICATION }}
      - name: Verify and identify the compiled release
        run: node scripts/deploy/package.mjs
      - name: Test deployment safety
        run: python3 -m unittest discover -s test/deploy -v
      # Only the compiled site and its release.json metadata are published.
      - name: Save only the compiled dist/pwa content
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/pwa/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://pwastore.online
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the compiled PWA produced by the build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-${{ github.sha }}
          path: artifact
      # upload.sh sends artifact/ contents, not the repository.
      # remote.py activates the release at /var/www/apps/pwastore/app (symlink).
      # The result is /var/www/apps/pwastore/app/index.html, without dist/pwa nesting.
      - name: Deploy the compiled PWA to /var/www/apps/pwastore/app
        run: bash scripts/deploy/upload.sh
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      # Nginx security headers and API CORS are checked after every release. A failure is
      # reported on the run without failing it or rolling back: the site was already verified.
      - name: Check security headers and API CORS
        continue-on-error: true
        run: python3 scripts/deploy/check_runtime.py
      - name: Report deployment failure
        if: failure()
        run: echo 'Échec du déploiement. Consulter les logs SSH pour le résultat du rollback ; vérifier le lien app avant toute relance.' >> "$GITHUB_STEP_SUMMARY"
